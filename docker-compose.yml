services:
  db:
    image: postgres:16
    container_name: apartment-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apartment_${APP_ENV:?APP_ENV is required}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d apartment_${APP_ENV:?APP_ENV is required}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apartment-backend

    container_name: apartment-backend

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - ./apartment-backend/.env.${APP_ENV:?APP_ENV is required}

    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}

    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./apartment-frontend

    container_name: apartment-frontend

    depends_on:
      backend:
        condition: service_started

    env_file:
      - ./apartment-frontend/.env.${APP_ENV:?APP_ENV is required}

    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}

    ports:
      - "4200:4200"

volumes:
  postgres_data: